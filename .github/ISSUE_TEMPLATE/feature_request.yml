name: Feature request
description: A new memory system, importer, metric or viewer improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would it solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For a new memory system, link its docs and say whether it runs locally.
