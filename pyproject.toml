[project]
name = "memarena"
version = "0.1.1"
description = "Benchmark memory layers on your own conversations, not on someone else's leaderboard."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Diego Pérez" }]
requires-python = ">=3.11"
keywords = ["llm", "memory", "benchmark", "rag", "mem0", "letta", "evaluation", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "openai==3.42.1",
  "rich==15.0.0",
  "typer==0.27.3",
]

[project.optional-dependencies]
mem0 = ["mem0ai==2.2.1", "ollama==0.6.3"]
letta = ["letta-client==1.12.1"]
supermemory = ["supermemory==5.0.1"]

[project.urls]
Homepage = "https://diegoperezg7.github.io/memarena/"
Repository = "https://github.com/diegoperezg7/memarena"
Issues = "https://github.com/diegoperezg7/memarena/issues"
Changelog = "https://github.com/diegoperezg7/memarena/blob/main/CHANGELOG.md"

[project.scripts]
memarena = "memarena.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3"]

[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/memarena"]

[tool.hatch.build.targets.sdist]
include = ["src/memarena", "tests", "README.md", "README.es.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon (Linux CI only)"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
